<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文件上传测试页面</title>
    <link rel="stylesheet" href="static.css">
</head>

<body>
    <h1>文件上传测试页面</h1>

    <!-- 单文件上传测试 -->
    <div class="upload-section">
        <h2>单文件上传测试</h2>
        <form action="/upload" method="post" enctype="multipart/form-data">
            <div class="form-group">
                <label for="s_file">选择文件:</label>
                <input type="file" id="file" name="s_file" required>
            </div>
            <input type="submit" value="上传单个文件">
        </form>
    </div>

    <!-- 批量文件上传测试 -->
    <div class="upload-section">
        <h2>批量文件上传测试</h2>
        <form action="http://localhost:8080/upload" method="post" enctype="multipart/form-data">
            <div class="form-group">
                <label for="s_files">选择多个文件:</label>
                <input type="file" id="files" name="s_files" multiple required>
            </div>
            <input type="submit" value="上传多个文件">
        </form>
    </div>
</body>

</html>
